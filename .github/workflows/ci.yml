name: CI

# Everything that must be true before anything reaches the shop: the types hold,
# the rules hold, the API holds against a real Postgres, and the thing builds.
# The deploy runs from the same commit, so a red run here is a warning that what
# is live was not checked by these steps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Types and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate the database client
        run: npx prisma generate
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: The rules, as plain functions
        run: npm test

  api:
    name: The API against Postgres
    runs-on: ubuntu-latest

    # The same engine the shop runs on, beside the job rather than in Docker:
    # a build server has no Docker to start a container with.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escape
          POSTGRES_PASSWORD: escape
          POSTGRES_DB: escape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escape -d escape"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://escape:escape@localhost:5432/escape?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate the database client
        run: npx prisma generate
      - name: The API, end to end
        run: npm run test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest

    # The build runs `prisma db push`, so it needs a database of its own — an
    # empty one, which also proves the schema applies to a fresh shop.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escape
          POSTGRES_PASSWORD: escape
          POSTGRES_DB: escape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escape -d escape"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://escape:escape@localhost:5432/escape?schema=public
      NEXTAUTH_SECRET: build-only-secret-not-used-anywhere
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the way the host builds it
        run: npm run build
